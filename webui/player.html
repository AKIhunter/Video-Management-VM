<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线播放</title>
<style>
:root{
  --bg:#0f1217; --panel:#161a22; --panel2:#1c212b; --line:#262c38;
  --txt:#eceae6; --muted:#98a1b1; --accent:#ff5c8a; --warn:#ffb26b;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0b0e13,#0f1217) fixed;color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------------- 顶栏 ---------------- */
.p-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 24px;
  background:rgba(15,18,23,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.p-back{color:var(--accent);font-size:14px;white-space:nowrap}
.p-back:hover{color:#fff}
.p-title{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-muted{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}

/* ---------------- 舞台（播放器与轮播同宽） ---------------- */
.p-stage{max-width:1440px;margin:0 auto;padding:20px 24px 56px}
/* 播放窗口：宽度铺满舞台，与下方轮播区域严格同宽 */
.p-player{width:100%}
.p-player video{width:100%;max-height:76vh;background:#000;border-radius:var(--radius);display:block;
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
.p-warn{background:#3a2410;border:1px solid var(--warn);color:var(--warn);border-radius:8px;
  padding:8px 10px;font-size:12px;margin-top:12px}
.p-error{color:var(--muted);font-size:14px;padding:60px 20px;text-align:center}

/* ---------------- 推荐轮播 ---------------- */
.p-reco{margin-top:26px}
.p-reco-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.p-reco-title{font-size:15px;font-weight:700;letter-spacing:.2px}
.p-reco-title:before{content:"◆";color:var(--accent);margin-right:6px}
.p-reco-sub{color:var(--muted);font-size:12px;min-width:0;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.p-reco-tools{display:flex;gap:8px;flex:0 0 auto}
.rc-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;
  font-size:12px;color:var(--muted);transition:.15s;white-space:nowrap}
.rc-btn:hover{border-color:var(--accent);color:var(--accent)}
.rc-btn.on{color:var(--accent);border-color:rgba(255,92,138,.55);background:rgba(255,92,138,.1)}
.rc-btn:disabled{opacity:.45;cursor:default}

.rc-carousel{position:relative}
.rc-viewport{overflow:hidden;border-radius:var(--radius)}
.rc-track{display:flex;align-items:stretch;transition:transform .52s cubic-bezier(.4,0,.2,1);will-change:transform}
/* 每页 2 行 × 6 列 = 12 格，永不滚动 */
.rc-page{flex:0 0 100%;min-width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;align-content:start;padding:2px}

.rc-card{position:relative;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.rc-card:hover{transform:translateY(-3px);border-color:rgba(255,92,138,.65);
  box-shadow:0 10px 24px rgba(0,0,0,.5)}
.rc-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rc-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,92,138,.35)}

.rc-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#0b0e13;overflow:hidden}
/* contain：视频帧与竖版海报都不被拉伸放大（防失真） */
.rc-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.rc-thumb img.broken{opacity:0}
.rc-thumb:after{content:"";position:absolute;inset:0;background:rgba(4,6,10,.34);opacity:0;transition:.16s}
.rc-card:hover .rc-thumb:after{opacity:1}
.rc-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:0;transition:.16s}
.rc-card:hover .rc-play,.rc-card:focus-visible .rc-play{opacity:1}
.rc-play svg{width:30px;height:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}

.rc-score{position:absolute;top:6px;right:6px;z-index:3;background:rgba(9,11,15,.8);
  border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:10px;line-height:16px;color:var(--warn)}
.rc-flag{position:absolute;top:6px;left:6px;z-index:3;background:rgba(255,92,138,.88);color:#15181f;
  border-radius:6px;padding:0 5px;font-size:10px;line-height:16px;font-weight:700}

.rc-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12px;font-weight:600;line-height:1.36;padding:7px 8px 0;min-height:40px}
.rc-why{display:flex;gap:4px;flex-wrap:wrap;padding:5px 8px 8px}
.rc-why span{font-size:10px;line-height:15px;color:var(--accent);background:rgba(255,92,138,.1);
  border:1px solid rgba(255,92,138,.28);border-radius:4px;padding:0 5px;white-space:nowrap}
.rc-why span.muted{color:var(--muted);border-color:var(--line);background:transparent}

/* 翻页按钮 */
.rc-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:34px;height:58px;
  display:grid;place-items:center;font-size:20px;line-height:1;color:var(--txt);
  background:rgba(13,16,22,.82);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(6px);transition:.15s}
.rc-nav:hover{border-color:var(--accent);color:var(--accent)}
.rc-nav[disabled]{opacity:.2;cursor:default}
.rc-prev{left:-8px}.rc-next{right:-8px}

.rc-dots{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px}
.rc-dot{width:7px;height:7px;border-radius:50%;background:#39404e;transition:.22s;padding:0}
.rc-dot:hover{background:#596274}
.rc-dot.on{width:20px;border-radius:4px;background:var(--accent)}
.rc-pageinfo{text-align:center;color:var(--muted);font-size:11px;margin-top:7px;min-height:14px}

/* 骨架屏 / 空态 */
.rc-skel{border-radius:10px;min-height:150px;background:linear-gradient(100deg,#171c25 32%,#212936 50%,#171c25 68%);
  background-size:220% 100%;animation:rc-sk 1.15s linear infinite}
@keyframes rc-sk{0%{background-position:180% 0}100%{background-position:-40% 0}}
.rc-empty{grid-column:1/-1;color:var(--muted);font-size:13px;text-align:center;padding:38px 10px}
.rc-link{color:var(--accent);text-decoration:underline}

/* ---------------- 响应式：宽屏严格 2×6，窄屏降列保证可读 ---------------- */
@media (max-width:1200px){
  .rc-page{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:820px){
  .p-stage{padding:16px 14px 40px}
  .rc-page{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rc-nav{display:none}
  .p-muted{display:none}
}
@media (max-width:520px){
  .rc-page{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-title{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .rc-track{transition:none}
  .rc-skel{animation:none}
  .rc-card{transition:none}
}
</style>
</head>
<body>
<div class="p-top">
  <a class="p-back" href="index.html">← 返回</a>
  <div class="p-title" id="title">加载中…</div>
  <div class="p-muted" id="meta"></div>
</div>

<div class="p-stage" id="stage">
  <!-- 播放窗口：宽度与下方轮播区域完全一致 -->
  <div class="p-player" id="player">
    <video id="video" controls autoplay playsinline></video>
    <div class="p-warn" id="guard" style="display:none"></div>
  </div>

  <!-- 推荐轮播：每页 2 行 × 6 列 = 12 格，不滚动 -->
  <section class="p-reco" id="recoSec">
    <header class="p-reco-head">
      <h2 class="p-reco-title">为你推荐</h2>
      <span class="p-reco-sub" id="recoSub">正在分析…</span>
      <div class="p-reco-tools">
        <button class="rc-btn" id="recoShuffle" type="button" title="按同样的规则重新挑一批">↻ 换一批</button>
        <button class="rc-btn" id="recoAuto" type="button" aria-pressed="true" title="开启/关闭自动翻页">⏯ 自动轮播</button>
      </div>
    </header>
    <div class="rc-carousel">
      <button class="rc-nav rc-prev" id="rcPrev" type="button" aria-label="上一页">‹</button>
      <div class="rc-viewport" id="rcViewport">
        <div class="rc-track" id="rcTrack"></div>
      </div>
      <button class="rc-nav rc-next" id="rcNext" type="button" aria-label="下一页">›</button>
    </div>
    <div class="rc-dots" id="rcDots" role="tablist" aria-label="推荐页码"></div>
    <div class="rc-pageinfo" id="rcPageInfo" aria-live="polite"></div>
  </section>
</div>

<script>
"use strict";

var VIDEO = document.getElementById("video");
var TITLE = document.getElementById("title");
var META  = document.getElementById("meta");
var GUARD = document.getElementById("guard");
var TRACK = document.getElementById("rcTrack");
var DOTS  = document.getElementById("rcDots");
var PREV  = document.getElementById("rcPrev");
var NEXT  = document.getElementById("rcNext");
var PAGEINFO = document.getElementById("rcPageInfo");
var SUBS  = document.getElementById("recoSub");
var VIEW  = document.getElementById("rcViewport");

var PER_PAGE = 12;          // 2 行 × 6 列
var MAX_PAGES = 3;
var AUTO_DELAY = 8000;      // 自动轮播间隔（毫秒）
var currentId = null;

/* 轮播状态 */
var reco = { pages: [], page: 0, auto: true, timer: null, hover: false, seq: 0 };
var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtDuration(sec){
  sec = parseInt(sec, 10);
  if (!sec || sec <= 0) return "";
  var m = Math.floor(sec / 60);
  return m >= 60 ? (Math.floor(m/60) + "小时" + (m%60) + "分") : (m + " 分钟");
}

/* ---------------- 音量复用（跨视频/跨页面） ---------------- */
var VOL_KEY = "player_volume";
var savedVol = localStorage.getItem(VOL_KEY);
if (savedVol != null && !isNaN(parseFloat(savedVol))) {
  VIDEO.volume = Math.min(1, Math.max(0, parseFloat(savedVol)));
}
VIDEO.addEventListener("volumechange", function(){
  localStorage.setItem(VOL_KEY, VIDEO.volume);
});

/* ---------------- 播放 ---------------- */
function playId(mid){
  currentId = mid;
  markActive();                                  // 立即反馈高亮
  fetch("/api/play/" + mid + "/meta").then(function(r){ return r.ok ? r.json() : null; }).then(function(m){
    if (!m || mid !== currentId) return;
    var name = m.filename || ("#" + mid);
    document.title = name;
    TITLE.textContent = name;
    META.textContent = "#" + mid;
    if (m.guard && m.guard.oversized){
      GUARD.style.display = "block";
      GUARD.textContent = "⚠ " + m.guard.advice + "（" + (m.guard.size / 1073741824).toFixed(1) + "GB）";
    } else {
      GUARD.style.display = "none";
    }
  }).catch(function(){});
  VIDEO.src = "/api/play/" + mid;
  VIDEO.play().catch(function(){});
  loadReco(mid);
  if (history.replaceState) history.replaceState(null, "", "player.html?id=" + mid);
}

/* ---------------- 推荐轮播 ---------------- */
function skeleton(){
  var cells = "";
  for (var i = 0; i < PER_PAGE; i++) cells += '<div class="rc-skel"></div>';
  TRACK.innerHTML = '<div class="rc-page">' + cells + "</div>";
  DOTS.innerHTML = "";
  PAGEINFO.textContent = "";
  PREV.style.display = NEXT.style.display = "none";
}

function whyChips(it){
  var out = [];
  if (it.shared_tags > 0) out.push(it.shared_tags + " 个相同标签");
  if (it.reason && it.reason.indexOf("studio") >= 0) out.push("同制作组");
  if (it.reason && it.reason.indexOf("era") >= 0) out.push("同期作品");
  return out.slice(0, 2);
}

function cardHTML(it){
  var rating = (it.rating_norm != null) ? Number(it.rating_norm).toFixed(1) : "";
  var chips = whyChips(it);
  var why = chips.map(function(t){ return "<span>" + esc(t) + "</span>"; }).join("");
  var dur = fmtDuration(it.duration_sec);
  if (!chips.length && dur) why = '<span class="muted">' + esc(dur) + "</span>";
  var active = (it.id === currentId) ? " active" : "";
  return '<a class="rc-card' + active + '" href="#" data-id="' + it.id + '" title="' + esc(it.title || "") + '">'
    + '<span class="rc-thumb">'
    +   '<img loading="lazy" decoding="async" src="/api/poster/' + it.id + '" alt="' + esc(it.title || "") + '"'
    +     ' onerror="this.classList.add(\'broken\')">'
    +   (rating ? '<span class="rc-score">★' + rating + "</span>" : "")
    +   '<span class="rc-play" aria-hidden="true">'
    +     '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(255,92,138,.92)"/>'
    +     '<path d="M9.6 7.8v8.4l7-4.2z" fill="#15181f"/></svg>'
    +   "</span>"
    + "</span>"
    + '<span class="rc-name">' + esc(it.title || ("#" + it.id)) + "</span>"
    + (why ? '<span class="rc-why">' + why + "</span>" : "")
    + "</a>";
}

function renderReco(){
  var pages = reco.pages;
  TRACK.innerHTML = pages.map(function(items){
    return '<div class="rc-page">' + items.map(cardHTML).join("") + "</div>";
  }).join("");

  // 当前播放项所在页优先展示
  var at = -1;
  for (var p = 0; p < pages.length; p++){
    for (var k = 0; k < pages[p].length; k++){
      if (pages[p][k].id === currentId){ at = p; break; }
    }
    if (at >= 0) break;
  }
  reco.page = at >= 0 ? at : 0;

  var multi = pages.length > 1;
  if (multi){
    DOTS.innerHTML = pages.map(function(_, i){
      return '<button class="rc-dot" type="button" role="tab" data-i="' + i
        + '" aria-label="第 ' + (i + 1) + ' 页"></button>';
    }).join("");
  } else {
    DOTS.innerHTML = "";
  }
  PREV.style.display = NEXT.style.display = multi ? "" : "none";
  go(reco.page, true);
}

function go(i, instant){
  var n = reco.pages.length;
  if (!n) return;
  reco.page = ((i % n) + n) % n;
  if (instant){
    TRACK.style.transition = "none";
    TRACK.style.transform = "translate3d(-" + (reco.page * 100) + "%,0,0)";
    var t = TRACK;
    requestAnimationFrame(function(){ t.style.transition = ""; });
  } else {
    TRACK.style.transform = "translate3d(-" + (reco.page * 100) + "%,0,0)";
  }
  var kids = DOTS.children;
  for (var k = 0; k < kids.length; k++) kids[k].classList.toggle("on", k === reco.page);
  PAGEINFO.textContent = n > 1 ? ("第 " + (reco.page + 1) + " / " + n + " 页") : "";
  restartAuto();
}

function restartAuto(){
  clearTimeout(reco.timer);
  if (!reco.auto || reco.hover || reco.pages.length < 2) return;
  reco.timer = setTimeout(function(){
    if (!document.hidden && !reco.hover) go(reco.page + 1);
    restartAuto();
  }, AUTO_DELAY);
}

function markActive(){
  var cards = document.querySelectorAll(".rc-card");
  for (var i = 0; i < cards.length; i++){
    cards[i].classList.toggle("active", Number(cards[i].dataset.id) === currentId);
  }
}

function setSub(profile, total){
  if (!profile){ SUBS.textContent = ""; return; }
  var bits = [];
  if (profile.tag_count) bits.push(profile.tag_count + " 个标签");
  if (profile.studio) bits.push(esc(profile.studio));
  if (profile.year) bits.push(profile.year + " 年");
  bits.push("共 " + (profile.candidate_total || total || 0) + " 部候选");
  SUBS.innerHTML = "基于 " + bits.join(" · ") + " 智能排序";
}

function loadReco(mid, seed){
  var seq = ++reco.seq;
  if (!TRACK.querySelector(".rc-card")) skeleton();     // 首次才出骨架，切换时保持旧内容避免闪烁
  var url = "/api/media/" + mid + "/recommend?per_page=" + PER_PAGE + "&pages=" + MAX_PAGES
          + (seed ? ("&seed=" + seed) : "");
  fetch(url).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(d){
    if (seq !== reco.seq || mid !== currentId) return;
    reco.pages = (d.pages || []).filter(function(p){ return p && p.length; });
    if (!reco.pages.length){
      TRACK.innerHTML = '<div class="rc-page"><div class="rc-empty">暂无推荐</div></div>';
      DOTS.innerHTML = ""; PAGEINFO.textContent = "";
      PREV.style.display = NEXT.style.display = "none";
      SUBS.textContent = "";
      return;
    }
    setSub(d.profile, d.pages.length);
    renderReco();
  }).catch(function(){
    if (seq !== reco.seq) return;
    TRACK.innerHTML = '<div class="rc-page"><div class="rc-empty">推荐加载失败，'
      + '<button class="rc-link" id="rcRetry" type="button">重试</button></div></div>';
    DOTS.innerHTML = ""; PAGEINFO.textContent = "";
    PREV.style.display = NEXT.style.display = "none";
    var b = document.getElementById("rcRetry");
    if (b) b.addEventListener("click", function(){ loadReco(mid, Math.floor(Math.random() * 1e6)); });
  });
}

/* ---------------- 交互绑定 ---------------- */
PREV.addEventListener("click", function(){ go(reco.page - 1); });
NEXT.addEventListener("click", function(){ go(reco.page + 1); });

DOTS.addEventListener("click", function(e){
  var d = e.target.closest(".rc-dot");
  if (d) go(Number(d.dataset.i));
});

TRACK.addEventListener("click", function(e){
  var card = e.target.closest(".rc-card");
  if (!card) return;
  e.preventDefault();
  var id = Number(card.dataset.id);
  if (id !== currentId) playId(id);
});

VIEW.addEventListener("mouseenter", function(){ reco.hover = true; clearTimeout(reco.timer); });
VIEW.addEventListener("mouseleave", function(){ reco.hover = false; restartAuto(); });
VIEW.addEventListener("focusin", function(){ reco.hover = true; clearTimeout(reco.timer); });
VIEW.addEventListener("focusout", function(){ reco.hover = false; restartAuto(); });

document.getElementById("recoShuffle").addEventListener("click", function(){
  if (currentId) loadReco(currentId, Math.floor(Math.random() * 1e6));
});

var AUTO_BTN = document.getElementById("recoAuto");
function paintAuto(){
  AUTO_BTN.classList.toggle("on", reco.auto);
  AUTO_BTN.setAttribute("aria-pressed", reco.auto ? "true" : "false");
  AUTO_BTN.textContent = reco.auto ? "⏸ 自动轮播" : "▶ 自动轮播";
}
AUTO_BTN.addEventListener("click", function(){
  reco.auto = !reco.auto;
  localStorage.setItem("reco_auto", reco.auto ? "1" : "0");
  paintAuto();
  restartAuto();
});

document.addEventListener("keydown", function(e){
  if (e.target === VIDEO) return;                       // 不抢播放器方向键
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (e.key === "ArrowRight") go(reco.page + 1);
  else if (e.key === "ArrowLeft") go(reco.page - 1);
});

document.addEventListener("visibilitychange", function(){
  if (!document.hidden) restartAuto();
});

/* 自动轮播初始状态：用户上次选择 > 系统动效偏好 */
(function initAuto(){
  var saved = localStorage.getItem("reco_auto");
  reco.auto = saved === null ? !reducedMotion : saved === "1";
  paintAuto();
})();

/* ---------------- 启动 ---------------- */
var id = new URLSearchParams(location.search).get("id");
if (!id){
  document.title = "缺少 id";
  TITLE.textContent = "缺少 id 参数";
  document.getElementById("recoSec").style.display = "none";
  document.getElementById("player").innerHTML =
    '<div class="p-error">缺少 id 参数，请从作品列表进入。</div>';
} else {
  playId(id);
}
</script>
</body>
</html>
